<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<title>TriClima SC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0b1220;--card:#121b2e;--card2:#18233b;--line:#24314f;--tx:#e8eefc;--mut:#8d9bbd;
  --ok:#22c55e;--mid:#eab308;--bad:#f97316;--nope:#ef4444;--blue:#38bdf8;--org:#fb923c;--acc:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.95);backdrop-filter:blur(8px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:18px;letter-spacing:.3px}
.brand h1 span{color:var(--acc)}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 10px;font-size:14px}
.locrow{display:flex;gap:8px;margin-top:10px}
select,input{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 10px;font-size:15px;width:100%}
.upd{font-size:12px;color:var(--mut);margin-top:6px}
main{padding:12px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.now{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.big{font-size:52px;font-weight:700;line-height:1}
.big small{font-size:22px;color:var(--mut)}
.nowinfo{font-size:14px;color:var(--mut)}
.nowinfo b{color:var(--tx)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card2);border-radius:12px;padding:9px;text-align:center}
.stat .v{font-size:18px;font-weight:700}
.stat .l{font-size:11px;color:var(--mut)}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alert.r{background:#3b1219;border:1px solid #7f1d1d}
.alert.y{background:#3a2e0b;border:1px solid #854d0e}
.alert.g{background:#0f2e1c;border:1px solid #166534}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center}
.ring{width:72px;height:72px;margin:0 auto 4px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.sc .t{font-weight:600}
.sc .q{font-size:12px}
.indoor{margin-top:6px;font-size:12px;font-weight:700;color:#fde68a;background:#3a2e0b;border-radius:8px;padding:4px}
.sc ul{list-style:none;font-size:11px;color:var(--mut);margin-top:4px;min-height:14px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;min-width:70px;color:var(--tx)}
.day.on{border-color:var(--acc);background:#1d3157}
.day .d{font-size:12px;color:var(--mut)}
.day .e{font-size:20px}
.day .tt{font-size:13px}
.day .rr{font-size:11px;color:var(--blue)}
canvas{width:100%;height:170px;display:block}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.hours{max-height:420px;overflow-y:auto}
.hr{display:grid;grid-template-columns:42px 28px 44px 1fr 1fr 54px;gap:4px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
.hr.night{opacity:.55}
.hr.cur{background:#1d3157;border-radius:8px}
.hr .h{color:var(--mut)}
.hr .rain{color:var(--blue)}
.arrow{display:inline-block;transition:transform .2s}
.dots{display:flex;gap:3px;justify-content:flex-end}
.dot{width:14px;height:14px;border-radius:4px;font-size:9px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700}
.hhead{font-size:11px;color:var(--mut);border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 4px;border-radius:8px;font-size:13px}
.seg button.on{background:#1d3157;color:var(--tx);font-weight:600}
.win{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.win .w1{font-weight:600}
.win .w2{font-size:12px;color:var(--mut)}
.badge{border-radius:8px;padding:3px 8px;font-weight:700;color:#000;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:11px}
td:first-child,th:first-child{text-align:left}
.muted{color:var(--mut);font-size:12px}
.tips{list-style:none;display:flex;flex-direction:column;gap:6px}
.tips li{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.btn{background:var(--acc);color:#04112a;border:0;border-radius:10px;padding:10px;font-weight:700;width:100%;font-size:14px}
.tabs{position:sticky;top:0;z-index:4;display:flex;gap:4px;max-width:640px;margin:8px auto 0;padding:0 12px}
.tabs button{flex:1;white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:10px 2px;font-size:13px}
.tabs button.on{background:#1d3157;color:var(--tx);border-color:var(--acc);font-weight:700}
main.tab[hidden]{display:none}
main.tab{padding:12px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.err{color:#fca5a5;font-size:14px}
.loading{text-align:center;color:var(--mut);padding:30px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:80vh;overflow:auto}
.res{padding:10px;border-bottom:1px solid var(--line)}
.compass{width:110px;height:110px}
.windbox{display:flex;gap:14px;align-items:center}
footer{text-align:center;color:var(--mut);font-size:11px;padding:16px}
footer a{color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>🏊🚴🏃 Tri<span>Clima</span> SC</h1>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="btnGeo" title="Minha localização">📍</button>
      <button class="iconbtn" id="btnSearch" title="Buscar cidade">🔎</button>
      <button class="iconbtn" id="btnRefresh" title="Atualizar">⟳</button>
    </div>
  </div>
  <div class="locrow"><select id="loc"></select></div>
  <div class="upd" id="upd">—</div>
</header>

<nav class="tabs" id="tabs"><button data-t="app" class="on">☁️ Tempo</button><button data-t="tabTreino">🏁 Treinos</button><button data-t="tabSug">💡 Sugestões</button><button data-t="tabPerf">📈 Perf.</button></nav>
<main id="tabTreino" class="tab" hidden></main>
<main id="app" class="tab">
  <div class="loading">Carregando previsão…</div>
</main>
<main id="tabSug" class="tab" hidden></main>
<main id="tabPerf" class="tab" hidden></main>

<div class="sheet" id="sheet"><div class="in">
  <h2 style="margin-bottom:10px">Buscar local em SC</h2>
  <input id="q" placeholder="Ex.: Bombinhas, Penha, Rio do Sul…" autocomplete="off">
  <div id="results" style="margin-top:8px"></div>
  <button class="iconbtn" style="margin-top:12px;width:100%" id="closeSheet">Fechar</button>
</div></div>

<footer>Dados: <a href="https://open-meteo.com/">Open-Meteo</a> (ECMWF, GFS, ICON e modelo marinho). Notas por modalidade são estimativas para treino — confira sempre as condições no local.</footer>

<script src="data.js"></script>
<script>
"use strict";
/* ===================== LOCAIS ===================== */
// type: mar = praia oceânica | lagoa = água abrigada | interior
const PRESETS = [
  {g:"Locais", n:"Jurerê Internacional", lat:-27.4390, lon:-48.4990, type:"mar"},
  {g:"Locais", n:"Beira-Mar Norte", lat:-27.5850, lon:-48.5480, type:"lagoa"},
  {g:"Locais", n:"Barreiros", lat:-27.5730, lon:-48.6190, type:"lagoa"},
  {g:"Locais", n:"Biguaçu", lat:-27.4940, lon:-48.6560, type:"lagoa"},
  {g:"Locais", n:"Balneário São Miguel (Biguaçu)", lat:-27.4230, lon:-48.6200, type:"lagoa"},
  {g:"Locais", n:"Governador Celso Ramos", lat:-27.3150, lon:-48.5590, type:"mar"},
  {g:"Locais", n:"Palhoça", lat:-27.6450, lon:-48.6700, type:"interior"},
  {g:"Locais", n:"Praia da Pinheira", lat:-27.8660, lon:-48.5880, type:"mar"},
  {g:"Locais", n:"Lages", lat:-27.8160, lon:-50.3260, type:"interior"},
];

/* ===================== ESTADO ===================== */
const store = {
  get(k,d){try{const v=localStorage.getItem("tcsc_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("tcsc_"+k,JSON.stringify(v))}catch(e){}}
};
let custom = store.get("custom", []);
let curLoc = store.get("loc", PRESETS[0]);
if(curLoc.g!=="GPS" && curLoc.g!=="Meus locais" && !PRESETS.some(p=>p.lat===curLoc.lat&&p.lon===curLoc.lon)) curLoc = PRESETS[0];
let race = store.get("race", {name:"Ironman Florianópolis", date:"2027-06-10", loc:0, start:6});
if(race.loc >= PRESETS.length + custom.length) race.loc = 0;
let data = null, marine = null, models = null;
let selDay = 0, winSport = "bike", winDur = 2;

const $ = s => document.querySelector(s);
const app = $("#app");

/* ===================== API ===================== */
const H = "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m,uv_index,is_day,cape";
const D = "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max,sunrise,sunset";
const C = "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day";
const MODELS = ["ecmwf_ifs025","gfs_seamless","icon_seamless"];
const MODEL_NAMES = {ecmwf_ifs025:"ECMWF",gfs_seamless:"GFS",icon_seamless:"ICON"};

async function getJSON(url){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 15000);
  let r;
  try{ r = await fetch(url,{signal:ctl.signal}); }
  catch(e){ throw new Error(e.name==="AbortError" ? "tempo esgotado" : "sem acesso à internet neste visualizador"); }
  finally{ clearTimeout(tm); }
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function fcUrl(l, days=7){
  return `https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&hourly=${H}&daily=${D}&current=${C}&timezone=America%2FSao_Paulo&forecast_days=${days}&wind_speed_unit=kmh`;
}
function marUrl(l, days=7){
  return `https://marine-api.open-meteo.com/v1/marine?latitude=${l.lat}&longitude=${l.lon}&hourly=wave_height,wave_period,wave_direction,sea_surface_temperature&timezone=America%2FSao_Paulo&forecast_days=${days}`;
}
function modUrl(l){
  return `https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&daily=precipitation_sum,temperature_2m_max,wind_speed_10m_max&models=${MODELS.join(",")}&timezone=America%2FSao_Paulo&forecast_days=7`;
}

async function load(){
  app.innerHTML = `<div class="loading">Carregando previsão de ${esc(curLoc.n)}…</div>`;
  $("#upd").textContent = "Atualizando…";
  try{
    const wantMar = curLoc.type !== "interior";
    const [f, m, md] = await Promise.all([
      getJSON(fcUrl(curLoc)),
      wantMar ? getJSON(marUrl(curLoc)).catch(()=>null) : Promise.resolve(null),
      getJSON(modUrl(curLoc)).catch(()=>null)
    ]);
    data = f; marine = m; models = md;
    selDay = 0;
    store.set("cache_"+curLoc.lat+"_"+curLoc.lon, {f,m,md,t:Date.now()});
    render();
    $("#upd").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) + " · " + curLoc.n;
  }catch(e){
    const c = store.get("cache_"+curLoc.lat+"_"+curLoc.lon, null);
    if(c){
      data=c.f; marine=c.m; models=c.md; render();
      $("#upd").textContent = "Sem conexão — mostrando dados de " + new Date(c.t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    }else{
      app.innerHTML = `<div class="card"><p class="err" style="margin-bottom:10px">Não consegui buscar a previsão (${esc(e.message)}).</p>
        <p style="margin-bottom:6px">Se você abriu o arquivo dentro de outro app (Claude, WhatsApp, visualizador de arquivos), ele bloqueia a internet. Abra pelo <b>Chrome</b>:</p>
        <ol style="padding-left:18px;color:var(--mut);font-size:14px"><li>Baixe o arquivo</li><li>Abra o app <b>Arquivos</b> → Downloads</li><li>Toque e segure em <b>triclima-sc.html</b> → Abrir com → <b>Chrome</b></li></ol>
        <button class="btn" style="margin-top:12px" onclick="load()">Tentar de novo</button></div>`;
      $("#upd").textContent = "Erro";
      $("#tabTreino").innerHTML = app.innerHTML;
    }
  }
}

/* ===================== UTIL ===================== */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const DIRS = ["N","NE","L","SE","S","SO","O","NO"];
const DIRN = {N:"Norte",NE:"Nordeste",L:"Leste",SE:"Sudeste",S:"Sul",SO:"Sudoeste",O:"Oeste",NO:"Noroeste"};
const card = d => DIRS[Math.round(((d%360)+360)%360/45)%8];
const r0 = v => v==null||isNaN(v) ? "–" : Math.round(v);
const r1 = v => v==null||isNaN(v) ? "–" : (Math.round(v*10)/10).toString().replace(".",",");
const WD = ["dom","seg","ter","qua","qui","sex","sáb"];
function wIcon(code, day=1){
  if(code==null) return "·";
  if(code===0) return day?"☀️":"🌙";
  if(code<=2) return day?"🌤️":"☁️";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if(code>=51&&code<=57) return "🌦️";
  if((code>=61&&code<=67)||(code>=80&&code<=82)) return "🌧️";
  if(code>=71&&code<=77) return "🌨️";
  if(code>=95) return "⛈️";
  return "☁️";
}
function wText(code){
  if(code===0) return "Céu limpo"; if(code<=2) return "Poucas nuvens"; if(code===3) return "Nublado";
  if(code===45||code===48) return "Neblina"; if(code>=51&&code<=57) return "Garoa";
  if(code>=61&&code<=65) return "Chuva"; if(code>=66&&code<=67) return "Chuva congelante";
  if(code>=80&&code<=82) return "Pancadas de chuva"; if(code>=95) return "Trovoadas"; return "—";
}
function nowIdx(){
  const off = data.utc_offset_seconds*1000;
  const key = new Date(Date.now()+off).toISOString().slice(0,13);
  const i = data.hourly.time.findIndex(t=>t.slice(0,13)===key);
  return i<0?0:i;
}
function hourObj(i){
  const h = data.hourly;
  const o = {i, time:h.time[i]};
  for(const k of Object.keys(h)) if(k!=="time") o[k]=h[k][i];
  if(marine && marine.hourly){
    const mi = marine.hourly.time.indexOf(h.time[i]);
    if(mi>=0){ o.wave = marine.hourly.wave_height[mi]; o.wper = marine.hourly.wave_period[mi]; o.sst = marine.hourly.sea_surface_temperature[mi]; }
  }
  return o;
}
function colorFor(s){return s>=75?"var(--ok)":s>=50?"var(--mid)":s>=25?"var(--bad)":"var(--nope)"}
function labelFor(s){return s>=75?"Ótimo":s>=50?"Ok":s>=25?"Ruim":"Evite"}

/* ===================== NOTAS POR MODALIDADE ===================== */
function thunder(o){ return o.weather_code>=95 || (o.cape>1200 && o.precipitation_probability>=50); }
function clamp(s){return Math.max(0,Math.min(100,Math.round(s)))}

function scoreSwim(o){
  let s=100, r=[];
  if(thunder(o)) return {s:5, r:["risco de raio"]};
  if(curLoc.type==="interior") { r.push("sem dados de água"); }
  if(o.wave!=null && curLoc.type==="mar"){
    if(o.wave>0.6){ s-=(o.wave-0.6)*55; r.push(`ondas ${r1(o.wave)} m`); }
  }
  const sst = o.sst;
  if(sst!=null){ if(sst<15){s-=40;r.push(`água ${r0(sst)}°C`)} else if(sst<18){s-=20;r.push(`água fria ${r0(sst)}°C`)} }
  if(o.wind_speed_10m>20){ s-=(o.wind_speed_10m-20)*1.6; r.push(`vento ${r0(o.wind_speed_10m)}`); }
  if(o.wind_gusts_10m>35){ s-=(o.wind_gusts_10m-35)*1; }
  if(o.precipitation>2){ s-=12; r.push("chuva forte"); }
  if(o.temperature_2m<16){ s-=12; r.push("ar frio"); }
  if(!o.is_day){ s-=35; r.push("escuro"); }
  return {s:clamp(s), r};
}
function scoreBike(o){
  let s=100, r=[];
  if(thunder(o)) return {s:5, r:["risco de raio"]};
  const w=o.wind_speed_10m, g=o.wind_gusts_10m;
  if(w>15){ s-=(w-15)*2.2; r.push(`vento ${r0(w)} km/h`); }
  if(g>32){ s-=(g-32)*1.8; r.push(`rajadas ${r0(g)}`); }
  if(o.precipitation>=0.3){ s-= o.precipitation>2?45:25; r.push("pista molhada"); }
  else if(o.precipitation_probability>=60){ s-=10; r.push(`${o.precipitation_probability}% chuva`); }
  if(o.apparent_temperature>32){ s-=(o.apparent_temperature-32)*4; r.push(`calor ${r0(o.apparent_temperature)}°`); }
  if(o.temperature_2m<10){ s-=(10-o.temperature_2m)*3; r.push(`frio ${r0(o.temperature_2m)}°`); }
  if(o.weather_code===45||o.weather_code===48){ s-=20; r.push("neblina"); }
  if(!o.is_day){ s-=40; r.push("escuro"); }
  return {s:clamp(s), r};
}
function scoreRun(o){
  let s=100, r=[];
  if(thunder(o)) return {s:5, r:["risco de raio"]};
  const at=o.apparent_temperature;
  if(at>25){ s-=(at-25)*5.5; r.push(`sensação ${r0(at)}°`); }
  if(o.relative_humidity_2m>80 && o.temperature_2m>23){ s-=10; r.push(`umidade ${r0(o.relative_humidity_2m)}%`); }
  if(o.is_day && o.uv_index>7){ s-=(o.uv_index-7)*6; r.push(`UV ${r0(o.uv_index)}`); }
  if(o.precipitation>2){ s-=15; r.push("chuva forte"); }
  if(o.wind_speed_10m>35){ s-=12; r.push("vento forte"); }
  if(o.temperature_2m<7){ s-=(7-o.temperature_2m)*3; r.push("frio"); }
  if(!o.is_day){ s-=12; r.push("escuro"); }
  return {s:clamp(s), r};
}
const SPORTS = {swim:{n:"Natação",e:"🏊",f:scoreSwim}, bike:{n:"Ciclismo",e:"🚴",f:scoreBike}, run:{n:"Corrida",e:"🏃",f:scoreRun}};

function wetsuit(sst){
  if(sst==null) return null;
  // Regras IRONMAN p/ amadores (age group): permitido até 24,5°C; 24,6–28,8 opcional sem premiação; acima proibido
  if(sst<=24.5) return {t:"Neoprene permitido", c:"g"};
  if(sst<=28.8) return {t:"Neoprene opcional (regra IRONMAN: sem premiação/ranking)", c:"y"};
  return {t:"Neoprene proibido", c:"r"};
}

/* ===================== RENDER ===================== */
function ring(score){
  const R=30, C=2*Math.PI*R, off=C*(1-score/100);
  return `<div class="ring"><svg width="72" height="72"><circle cx="36" cy="36" r="${R}" stroke="#24314f" stroke-width="7" fill="none"/>
  <circle cx="36" cy="36" r="${R}" stroke="${colorFor(score)}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
  <div class="n">${score}</div></div>`;
}

function next3hRain(ni){
  let mm=0, p=0;
  for(let i=ni;i<ni+3&&i<data.hourly.time.length;i++){ mm+=data.hourly.precipitation[i]||0; p=Math.max(p,data.hourly.precipitation_probability[i]||0); }
  return mm<0.2 && p<30 ? "seco" : `${r1(mm)}mm`;
}

function buildAlerts(ni){
  const a=[]; const h=data.hourly;
  // trovoada nas próximas 12h
  for(let i=ni;i<ni+12&&i<h.time.length;i++){
    const o=hourObj(i);
    if(thunder(o)){ a.push({c:"r",i:"⚡",t:`Risco de trovoada por volta das ${h.time[i].slice(11)} — evite água aberta e estrada exposta.`}); break; }
  }
  for(let i=ni;i<ni+12&&i<h.time.length;i++){
    if(h.wind_gusts_10m[i]>=50){ a.push({c:"r",i:"💨",t:`Rajadas de ${r0(h.wind_gusts_10m[i])} km/h às ${h.time[i].slice(11)} — perigoso para pedal com roda alta.`}); break; }
  }
  // vento sul / frente fria: virada para quadrante sul com rajada subindo nas próx 24h
  const d0=h.wind_direction_10m[ni];
  for(let i=ni+1;i<ni+24&&i<h.time.length;i++){
    const d=h.wind_direction_10m[i];
    const isSul = d>=150 && d<=230, wasSul = d0>=150&&d0<=230;
    if(isSul && !wasSul && h.wind_gusts_10m[i]>30){
      a.push({c:"y",i:"🌬️",t:`Virada para vento Sul (${r0(h.wind_gusts_10m[i])} km/h) por volta de ${fmtWhen(h.time[i])} — sinal de frente fria: temperatura cai e o mar agita.`}); break;
    }
  }
  if(curLoc.type==="mar" && marine){
    const o=hourObj(ni); if(o.wave!=null && o.wave>=1.5) a.push({c:"y",i:"🌊",t:`Mar agitado agora (${r1(o.wave)} m). Prefira lagoa/baía abrigada ou piscina.`});
  }
  return a;
}
function fmtWhen(t){
  const d=new Date(t+":00"); const today=new Date(data.hourly.time[nowIdx()]+":00");
  const diff=Math.round((new Date(t.slice(0,10)+"T00:00")-new Date(today.toISOString().slice(0,10)+"T00:00"))/864e5);
  return (diff===0?"hoje ":diff===1?"amanhã ":WD[d.getDay()]+" ")+t.slice(11);
}

function buildTips(ni){
  const t=[]; const d=data.daily, h=data.hourly;
  const tmax=d.temperature_2m_max[0], uv=d.uv_index_max[0];
  // janela fresca da manhã
  let coolEnd=null;
  for(let i=ni;i<h.time.length && h.time[i].slice(0,10)===d.time[0];i++){ if(h.apparent_temperature[i]>=27){coolEnd=h.time[i].slice(11);break;} }
  if(tmax>=29) t.push(`🔥 Dia quente (máx ${r0(tmax)}°). ${coolEnd?`Sensação passa de 27° a partir das ${coolEnd} — longões antes disso.`:"Treine cedo."} Reforce sódio: ~500–1000 mg/h em treinos longos.`);
  if(uv>=8) t.push(`🧴 UV ${r0(uv)} (muito alto). Protetor resistente à água e reaplicar após a natação.`);
  if(d.temperature_2m_min[0]<=12) t.push(`🧤 Manhã fria (mín ${r0(d.temperature_2m_min[0])}°). Para o pedal: manguito, colete corta-vento e luva.`);
  const g=d.wind_gusts_10m_max[0];
  if(g>=40) t.push(`💨 Rajadas até ${r0(g)} km/h. Prefira roda de perfil baixo e rotas protegidas; vento ${card(d.wind_direction_10m_dominant[0])} dominante — comece o pedal contra o vento para voltar com ele a favor.`);
  else t.push(`🧭 Vento dominante ${card(d.wind_direction_10m_dominant[0])} (máx ${r0(d.wind_speed_10m_max[0])} km/h). Saia contra o vento e volte a favor.`);
  if((d.precipitation_probability_max[0]||0)>=60) t.push(`☔ Chuva provável hoje (${d.precipitation_probability_max[0]}%). Se pedalar, pneus com menos pressão e cuidado com faixas pintadas.`);
  const o=hourObj(ni);
  if(o.sst!=null && o.sst<19 && curLoc.type!=="interior") t.push(`🥶 Água a ${r1(o.sst)}°C: neoprene e touca dupla para nado longo.`);
  // hidratação estimada pela sensação
  const at=Math.max(...h.apparent_temperature.slice(ni,ni+6));
  const ml = at>=30?"800–1000":at>=24?"600–800":"400–600";
  t.push(`💧 Hidratação estimada nas próximas horas: ${ml} ml/h (ajuste ao seu suor).`);
  return t;
}

function renderDay(){
  const day=data.daily.time[selDay];
  const idx=data.hourly.time.map((t,i)=>t.startsWith(day)?i:-1).filter(i=>i>=0);
  const ni=nowIdx();
  const dt=new Date(day+"T12:00:00");
  $("#dayLbl").textContent = selDay===0?"hoje":WD[dt.getDay()]+" "+dt.getDate()+"/"+(dt.getMonth()+1);
  $("#hours").innerHTML = idx.filter(i=>selDay>0||i>=ni).map(i=>{
    const o=hourObj(i);
    const sc=["swim","bike","run"].map(k=>{
      if(k==="swim"&&curLoc.type==="interior") return `<div class="dot" style="background:#334155;color:#94a3b8">–</div>`;
      const s=SPORTS[k].f(o).s; return `<div class="dot" style="background:${colorFor(s)}" title="${SPORTS[k].n}: ${s}">${Math.round(s/10)}</div>`;
    }).join("");
    return `<div class="hr ${o.is_day?"":"night"} ${i===ni?"cur":""}">
      <div class="h">${o.time.slice(11)}</div><div>${wIcon(o.weather_code,o.is_day)}</div><div><b>${r0(o.temperature_2m)}°</b></div>
      <div class="rain">${o.precipitation_probability??"–"}% ${o.precipitation>0?r1(o.precipitation)+"mm":""}</div>
      <div><span class="arrow" style="transform:rotate(${(o.wind_direction_10m+180)%360}deg)">↑</span> ${r0(o.wind_speed_10m)}<span class="muted">/${r0(o.wind_gusts_10m)} ${card(o.wind_direction_10m)}</span></div>
      <div class="dots">${sc}</div></div>`;
  }).join("");
  drawChart(idx);
}

function drawChart(idx){
  const cv=$("#chart"); const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, Hh=170; cv.width=W*dpr; cv.height=Hh*dpr;
  const g=cv.getContext("2d"); g.scale(dpr,dpr); g.clearRect(0,0,W,Hh);
  const h=data.hourly;
  const T=idx.map(i=>h.temperature_2m[i]), P=idx.map(i=>h.precipitation[i]||0), Wd=idx.map(i=>h.wind_speed_10m[i]), G=idx.map(i=>h.wind_gusts_10m[i]);
  const pad={l:26,r:26,t:12,b:20}; const cw=W-pad.l-pad.r, ch=Hh-pad.t-pad.b;
  const x=i=>pad.l+cw*(i/(idx.length-1));
  const tmin=Math.floor(Math.min(...T))-2, tmax=Math.ceil(Math.max(...T))+2;
  const wmax=Math.max(30,Math.ceil(Math.max(...G)/10)*10);
  const pmax=Math.max(5,Math.ceil(Math.max(...P)));
  g.font="10px system-ui"; g.fillStyle="#8d9bbd";
  // grid
  g.strokeStyle="#24314f"; g.lineWidth=1;
  for(let k=0;k<=4;k++){const y=pad.t+ch*k/4; g.beginPath(); g.moveTo(pad.l,y); g.lineTo(W-pad.r,y); g.stroke();
    g.textAlign="right"; g.fillText(Math.round(tmax-(tmax-tmin)*k/4)+"°",pad.l-3,y+3);
    g.textAlign="left"; g.fillText(Math.round(wmax-wmax*k/4),W-pad.r+3,y+3);}
  // noite
  idx.forEach((i,k)=>{ if(!h.is_day[i]){ g.fillStyle="rgba(0,0,0,.25)"; g.fillRect(x(k)-cw/(idx.length-1)/2,pad.t,cw/(idx.length-1),ch);} });
  // chuva
  const bw=Math.max(3,cw/idx.length*0.7);
  P.forEach((p,k)=>{ if(p<=0) return; const bh=ch*Math.min(1,p/pmax); g.fillStyle="rgba(56,189,248,.8)"; g.fillRect(x(k)-bw/2,pad.t+ch-bh,bw,bh); });
  const line=(arr,mn,mx,col,dash,wd)=>{ g.strokeStyle=col; g.lineWidth=wd; g.setLineDash(dash); g.beginPath();
    arr.forEach((v,k)=>{const y=pad.t+ch*(1-(v-mn)/(mx-mn)); k?g.lineTo(x(k),y):g.moveTo(x(k),y);}); g.stroke(); g.setLineDash([]); };
  line(G,0,wmax,"#64748b",[3,3],1.5);
  line(Wd,0,wmax,"#cbd5e1",[],1.5);
  line(T,tmin,tmax,"#fb923c",[],2.5);
  g.fillStyle="#8d9bbd"; g.textAlign="center";
  idx.forEach((i,k)=>{ if(k%3===0) g.fillText(h.time[i].slice(11,13)+"h",x(k),Hh-5); });
}

function renderWins(){
  const ni=nowIdx(); const N=Math.min(data.hourly.time.length, ni+72);
  const sc = i => { const o=hourObj(i);
    if(winSport==="brick") return Math.min(scoreBike(o).s, scoreRun(o).s);
    if(winSport==="swim" && curLoc.type==="interior") return null;
    return SPORTS[winSport].f(o).s; };
  if(winSport==="swim" && curLoc.type==="interior"){ $("#wins").innerHTML=`<p class="muted">Escolha um local de praia ou lagoa para ver janelas de natação.</p>`; return; }
  const cands=[];
  for(let s=ni; s+winDur<=N; s++){
    let min=101, sum=0, ok=true;
    for(let k=0;k<winDur;k++){ const v=sc(s+k); if(!data.hourly.is_day[s+k]){ok=false;break;} min=Math.min(min,v); sum+=v; }
    if(!ok) continue;
    cands.push({s, avg:sum/winDur, min, score:Math.round(0.6*sum/winDur+0.4*min)});
  }
  cands.sort((a,b)=>b.score-a.score);
  const pick=[];
  for(const c of cands){ if(pick.every(p=>Math.abs(p.s-c.s)>=Math.max(3,winDur))) pick.push(c); if(pick.length>=4) break; }
  if(!pick.length){ $("#wins").innerHTML=`<p class="muted">Nenhuma janela diurna de ${winDur}h nas próximas 72h.</p>`; return; }
  const indoorTxt = winSport==="bike"?"rolo":winSport==="run"?"esteira":winSport==="brick"?"rolo + esteira":"piscina";
  const ruim = pick[0].score<50 ? `<div class="alert y" style="margin-bottom:8px"><span>🏠</span><span>Nenhuma janela boa ao ar livre nas próximas 72h. Sugestão: treino indoor no <b>${indoorTxt}</b>.</span></div>` : "";
  $("#wins").innerHTML = ruim + pick.map(p=>{
    const t0=data.hourly.time[p.s], t1=data.hourly.time[p.s+winDur-1];
    const o=hourObj(p.s);
    const e=parseInt(t1.slice(11,13))+1;
    return `<div class="win"><div><div class="w1">${fmtWhen(t0)}–${String(e).padStart(2,"0")}:00</div>

function nutriPlan(sp,dur,it,at,hum){
  let ml = at<18?400:at<23?550:at<27?700:at<31?850:1000;
  if(hum>80 && at>=24) ml+=100;
  if(sp==="swim") ml=Math.min(ml,400);
  if(dur<=45 && it!=="forte") ml=Math.min(ml,500);
  const na = dur<60 ? 0 : at<23?300:at<28?500:800;
  let cho = dur<=60 ? (it==="forte"?20:0) : dur<=150 ? (it==="leve"?30:45) : (it==="leve"?50:75);
  if(sp==="swim") cho = dur>75?20:0;
  const totCho=Math.round(cho*dur/60), totMl=Math.round(ml*dur/60/50)*50;
  const pre = dur>=120 || it==="forte" ? "Refeição 2–3h antes com 1–2 g/kg de carboidrato (ex.: pão + banana + mel, tapioca, aveia). Se treinar muito cedo: banana ou torrada com mel 30–45 min antes." : "Lanche leve 45–60 min antes (banana, torrada com mel) ou em jejum se for leve e curto.";
  const durante = cho===0 ? "Só água (ou eletrólito se estiver quente)." :
    `~${cho} g de carboidrato por hora (total ≈ ${totCho} g): ${cho>=60?"gel a cada 25–30 min + isotônico":"1 gel ou meia barra a cada 40–45 min"}${sp==="run"||sp==="brick"?". Na corrida, prefira gel (mais fácil de digerir)":""}.`;
  const pos = dur>=90||it==="forte" ? "Até 1h depois: 20–30 g de proteína + 1 g/kg de carboidrato (ex.: iogurte + fruta + granola, ou arroz + frango). Reponha ~1,5× o peso perdido em líquidos." : "Refeição normal com proteína nas próximas 2h.";
  const hidr = sp==="swim" ? "Deixe uma garrafa na borda: beba entre as séries." : sp==="bike"||sp==="brick" ? `Leve ${Math.max(1,Math.ceil(totMl/600))} caramanhola(s) de 600 ml${na? " com eletrólito":""}.` : (totMl>500?"Leve cinto/colete de hidratação ou planeje parada para água.":"Hidrate bem antes; garrafinha opcional.");
  return `<div class="grid3" style="margin:0 0 10px"><div class="stat"><div class="v" style="color:var(--blue)">${ml}</div><div class="l">ml/h de líquido</div></div>
    <div class="stat"><div class="v">${cho||"0"}</div><div class="l">g/h carboidrato</div></div><div class="stat"><div class="v">${na||"—"}</div><div class="l">mg/h de sódio</div></div></div>
    <ul class="tips"><li>🍽️ <b>Antes:</b> ${pre}</li><li>⚡ <b>Durante:</b> ${durante}</li><li>💧 <b>Hidratação:</b> ${hidr} Total ≈ ${totMl} ml (sensação até ${r0(at)}°C).</li><li>🥛 <b>Depois:</b> ${pos}</li></ul>`;
}
function windowWeather(day,h0,dur){
  const idx=data.hourly.time.map((t,i)=>t.startsWith(day)&&+t.slice(11,13)>=h0&&+t.slice(11,13)<h0+Math.ceil(dur/60)?i:-1).filter(i=>i>=0);
  const di=Math.max(0,data.daily.time.indexOf(day));
  return { at: idx.length? Math.max(...idx.map(i=>data.hourly.apparent_temperature[i])) : data.daily.temperature_2m_max[di],
           hum: idx.length? Math.max(...idx.map(i=>data.hourly.relative_humidity_2m[i])) : 70, idx };

function bestSlot(day,sp,dur){
  // retorna melhor início (hora) no dia, só com luz do dia, e a nota
  const H=Math.ceil(dur/60); let best=null;
  const ni=nowIdx();
  for(let h=5; h+H<=20; h++){
    let min=101,sum=0,ok=true;
    for(let k=0;k<H;k++){
      const i=data.hourly.time.indexOf(`${day}T${String(h+k).padStart(2,"0")}:00`);
      if(i<0 || i<ni || !data.hourly.is_day[i]){ok=false;break;}
      const o=hourObj(i);
      const v = sp==="brick" ? Math.min(scoreBike(o).s,scoreRun(o).s) : sp==="swim" && curLoc.type==="interior" ? 60 : SPORTS[sp].f(o).s;
      min=Math.min(min,v); sum+=v;
    }
    if(!ok) continue;
    const sc=Math.round(0.6*sum/H+0.4*min);
    if(!best || sc>best.sc) best={h,sc};
  }
  return best;
}

/* ===================== SUGESTÕES DE TREINO (com base no histórico do Strava) ===================== */
const IRONMAN_DATA = "2027-06-10";
function alvosAtleta(S){
  const rec = Object.fromEntries((S.recordes||[]).map(([k,v,u,d])=>[k,{v,d}]));
  const hoje = Date.now();
  const recente = (r,meses)=> r && (hoje-Date.parse(r.d+"T12:00:00"))/864e5 < meses*30.5;
  // FTP estimado: maior entre o FTP do Strava, 1h recente e 95% dos 20 min (até 18 meses)
  const cand=[S.zonas.ftp||0];
  if(recente(rec.GreatestPower1hr,12)) cand.push(rec.GreatestPower1hr.v);
  if(recente(rec.GreatestPower20min,18)) cand.push(Math.round(rec.GreatestPower20min.v*0.95));
  const ftp=Math.max(...cand);
  // ritmo de 10 km: recorde de 10k, ou 5k × 1,04
  const p10 = rec.Fastest10k ? rec.Fastest10k.v/10 : rec.Fastest5k ? rec.Fastest5k.v/5*1.04 : 330;
  // natação: CSS aproximado = melhor ritmo médio em nados ≥1.000 m nas últimas 6 semanas
  const nados=(S.historico||[]).filter(h=>h[1]==="Swim"&&h[3]>=1000&&h[5]);
  const css = nados.length ? Math.min(...nados.map(h=>h[5])) : 115;
  return { ftp, ftpStrava:S.zonas.ftp, p10, css,
    corrida:{ z2:[p10*1.24,p10*1.36], limiar:[p10*1.03,p10*1.07], vo2:[p10*0.95,p10*0.99], prova:[p10*1.10,p10*1.16] },
    bike:{ z1:[0.45*ftp,0.55*ftp], z2:[0.56*ftp,0.75*ftp], sweet:[0.88*ftp,0.93*ftp], limiar:[0.95*ftp,1.0*ftp] },
    nado:{ z2:[css+6,css+12], css:[css-2,css+2] } };
}
const mmssS = s => Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const faixaP = a => `${mmssS(a[0])}–${mmssS(a[1])}/km`;
const faixaW = a => `${Math.round(a[0]/5)*5}–${Math.round(a[1]/5)*5} W`;
const faixaN = a => `${mmssS(a[0])}–${mmssS(a[1])}/100 m`;

function analisarHistorico(S, hoje){
  const H=(S.historico||[]).map(h=>({dia:h[0],tipo:h[1],min:h[2],dist:h[3],re:h[4],ritmo:h[5],hora:h[6]}));
  const t0=Date.parse(hoje+"T00:00:00Z"); const idade=d=>Math.round((t0-Date.parse(d+"T00:00:00Z"))/864e5);
  const mod=t=>t==="Swim"?"swim":/Ride/.test(t)?"bike":/Run/.test(t)?"run":"outro";
  const ult={}; H.forEach(h=>{const m=mod(h.tipo); if(!ult[m]||h.dia>ult[m]) ult[m]=h.dia;});
  const dias = m => ult[m]? idade(ult[m]) : 99;
  const jan=(a,b)=>H.filter(h=>idade(h.dia)>=a&&idade(h.dia)<b);
  const horas=(arr,m)=>arr.filter(h=>!m||mod(h.tipo)===m).reduce((s,h)=>s+h.min,0)/60;
  const u14=jan(0,14), u7=jan(0,7);
  const share={swim:horas(u14,"swim"),bike:horas(u14,"bike"),run:horas(u14,"run")}; const tot=share.swim+share.bike+share.run||1;
  const intensos=u7.filter(h=>h.re!=null&&h.min>=20&&h.re/(h.min/60)>=55).length;
  const longaoBike=H.filter(h=>mod(h.tipo)==="bike"&&h.min>=150).map(h=>idade(h.dia));
  const longaoRun=H.filter(h=>mod(h.tipo)==="run"&&h.min>=75).map(h=>idade(h.dia));
  const dSet={}; H.forEach(h=>{(dSet[h.dia]=dSet[h.dia]||new Set()).add(mod(h.tipo));});
  const bricks=Object.entries(dSet).filter(([d,s])=>s.has("bike")&&s.has("run")).map(([d])=>idade(d));
  const corridasLeves=u14.filter(h=>mod(h.tipo)==="run"&&h.ritmo&&h.min>=25&&h.min<=90);
  const ritmoLeve=corridasLeves.length? corridasLeves.reduce((s,h)=>s+h.ritmo*h.min,0)/corridasLeves.reduce((s,h)=>s+h.min,0) : null;
  const semanas4 = horas(jan(0,28))/4;
  const habitual = m => { const c={}; H.filter(h=>mod(h.tipo)===m&&h.hora!=null).forEach(h=>c[h.hora]=(c[h.hora]||0)+1); const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return e&&e[1]>=2?+e[0]:null; };
  return {dias, share:{swim:share.swim/tot,bike:share.bike/tot,run:share.run/tot}, h14:tot, intensos,
    ultLongaoBike: longaoBike.length?Math.min(...longaoBike):99, ultLongaoRun: longaoRun.length?Math.min(...longaoRun):99,
    ultBrick: bricks.length?Math.min(...bricks):99, ritmoLeve, nLeves:corridasLeves.length, semanas4, habitual};
}
function faseIronman(hoje){
  const sem=Math.round((Date.parse(IRONMAN_DATA)-Date.parse(hoje))/864e5/7);
  if(sem>24) return {sem, nome:"Base", alvo:[8,11], foco:"volume aeróbico (Z2), técnica de natação e força"};
  if(sem>12) return {sem, nome:"Construção", alvo:[11,14], foco:"longões progressivos, sweet spot no pedal e bricks"};
  if(sem>3)  return {sem, nome:"Específico/Pico", alvo:[13,17], foco:"ritmo de prova, longões de 5–6h e simulados"};
  return {sem, nome:"Polimento", alvo:[6,9], foco:"reduzir volume mantendo intensidade curta"};
}

  if(E.ultLongaoRun>10 && r<=1.25) sug.push({sp:"run",titulo:"Longão de corrida",dur:90,it:"leve",prio:3,

  if(E.intensos===0 && r<=1.2) sug.push({sp:"bike",titulo:"Sweet spot no pedal",dur:75,it:"forte",prio:4,
    desc:`15 min aquec. · 3×12 min a ${faixaW(A.bike.sweet)} (rec. 4 min leve) · 10 min solto. Ótimo no rolo.`,
    porque:"Nenhum treino intenso nos últimos 7 dias. Um estímulo de qualidade por semana mantém o limiar subindo."});
  else if(E.intensos>=3) dicas.push(`🔥 ${E.intensos} treinos intensos nos últimos 7 dias: segure os próximos em Z1–Z2.`);
  if(E.ultBrick>14 && r<=1.25 && F.nome!=="Polimento") sug.push({sp:"brick",titulo:"Brick (transição)",dur:90,it:"mod",prio:4,
    desc:`60 min de pedal a ${faixaW(A.bike.z2)} + troca rápida + 20–25 min de corrida a ${faixaP(A.corrida.prova)} (ritmo de prova).`,
    porque:`Sem treino de transição há ${E.ultBrick>=42?"mais de 6 semanas":E.ultBrick+" dias"}. Correr com as pernas cansadas do pedal se treina.`});
  // dicas
  if(E.ritmoLeve && E.nLeves>=2 && E.ritmoLeve < A.corrida.z2[0]-10)
    dicas.push(`🏃 Suas corridas recentes saíram em média a <b>${mmssS(E.ritmoLeve)}/km</b>, mais rápido que a sua Z2 estimada (${faixaP(A.corrida.z2)}). Para o Ironman, a maior parte das corridas deve ser fácil: segure o ritmo nas rodagens.`);

  sug.sort((a,b)=>a.prio-b.prio);
  return {sug:sug.slice(0,4), dicas, A, E, F};
}

async function raceLookup(days){
  const l=allLocs()[race.loc]||PRESETS[0]; const out=$("#rRes");

  try{
    if(days>=0 && days<=15){

      const m= l.type!=="interior" ? await getJSON(marUrl(l,8)).catch(()=>null) : null;
      const hrs=f.hourly.time.map((t,i)=>t.startsWith(race.date)?i:-1).filter(i=>i>=0 && +f.hourly.time[i].slice(11,13)>=6 && +f.hourly.time[i].slice(11,13)<=16);

      ${hrs.map(i=>`<tr><td>${f.hourly.time[i].slice(11)}</td><td>${wIcon(f.hourly.weather_code[i],1)}</td><td>${r0(f.hourly.temperature_2m[i])}°</td><td>${r0(f.hourly.apparent_temperature[i])}°</td><td style="color:var(--blue)">${f.hourly.precipitation_probability[i]??"–"}%</td><td>${r0(f.hourly.wind_speed_10m[i])}/${r0(f.hourly.wind_gusts_10m[i])} ${card(f.hourly.wind_direction_10m[i])}</td></tr>`).join("")}</table>`;
    }else{

      const thisYear=new Date().getFullYear();
      const years=[1,2,3,4,5].map(k=>thisYear-k);
      const reqs=years.map(y=>{
        const s=new Date(Date.UTC(y,M-1,Dd-3)).toISOString().slice(0,10), e=new Date(Date.UTC(y,M-1,Dd+3)).toISOString().slice(0,10);
        return getJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${l.lat}&longitude=${l.lon}&start_date=${s}&end_date=${e}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max&timezone=America%2FSao_Paulo`).then(j=>({y,j})).catch(()=>null);
      });
      const res=(await Promise.all(reqs)).filter(Boolean);
      if(!res.length) throw new Error("sem dados");
      let all={tx:[],tn:[],p:[],w:[],g:[]};
      const rows=res.map(({y,j})=>{
        const d=j.daily; const mid=Math.floor(d.time.length/2);
        d.temperature_2m_max.forEach(v=>v!=null&&all.tx.push(v)); d.temperature_2m_min.forEach(v=>v!=null&&all.tn.push(v));
        d.precipitation_sum.forEach(v=>v!=null&&all.p.push(v)); d.wind_speed_10m_max.forEach(v=>v!=null&&all.w.push(v)); d.wind_gusts_10m_max.forEach(v=>v!=null&&all.g.push(v));
        return `<tr><td>${y}</td><td>${r0(d.temperature_2m_min[mid])}° / ${r0(d.temperature_2m_max[mid])}°</td><td style="color:var(--blue)">${r1(d.precipitation_sum[mid])} mm</td><td>${r0(d.wind_speed_10m_max[mid])} / ${r0(d.wind_gusts_10m_max[mid])}</td></tr>`;
      }).join("");
      const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
      const rainy=all.p.filter(v=>v>=1).length/all.p.length*100;
      out.innerHTML=`<p style="margin-bottom:8px"><b>${esc(l.n)}</b> — como costuma ser o clima nessa época (±3 dias, ${res.length} anos):</p>
      <div class="grid3" style="margin:0 0 10px"><div class="stat"><div class="v">${r0(avg(all.tn))}°/${r0(avg(all.tx))}°</div><div class="l">mín/máx média</div></div>
      <div class="stat"><div class="v" style="color:var(--blue)">${r0(rainy)}%</div><div class="l">dias com chuva</div></div>
      <div class="stat"><div class="v">${r0(avg(all.g))}</div><div class="l">rajada média km/h</div></div></div>
      <table><tr><th>Ano</th><th>Mín/Máx</th><th>Chuva</th><th>Vento/Rajada</th></tr>${rows}</table>
      <p class="muted" style="margin-top:6px">A previsão de verdade aparece aqui a partir de 15 dias antes da prova.</p>`;
    }
  }catch(e){ out.innerHTML=`<p class="err">Não consegui buscar (${esc(e.message)}).</p>`; }
}

/* ===================== SELETOR DE LOCAL ===================== */
function fillSelect(){
  const sel=$("#loc"); const groups={};
  PRESETS.forEach((p,i)=>{(groups[p.g]=groups[p.g]||[]).push(`<option value="p${i}">${esc(p.n)}</option>`)});
  let h=Object.entries(groups).map(([g,o])=>`<optgroup label="${esc(g)}">${o.join("")}</optgroup>`).join("");
  if(custom.length) h=`<optgroup label="Meus locais">${custom.map((c,i)=>`<option value="c${i}">${esc(c.n)}</option>`).join("")}</optgroup>`+h;
  sel.innerHTML=h;
  const pi=PRESETS.findIndex(p=>p.lat===curLoc.lat&&p.lon===curLoc.lon);
  const ci=custom.findIndex(p=>p.lat===curLoc.lat&&p.lon===curLoc.lon);
  if(ci>=0) sel.value="c"+ci; else if(pi>=0) sel.value="p"+pi;
  else { sel.insertAdjacentHTML("afterbegin",`<option value="x">${esc(curLoc.n)}</option>`); sel.value="x"; }
}
$("#loc").onchange=e=>{
  const v=e.target.value; if(v==="x") return;
  curLoc = v[0]==="p" ? PRESETS[+v.slice(1)] : custom[+v.slice(1)];
  store.set("loc",curLoc); load();
};
$("#btnRefresh").onclick=()=>load();
$("#btnSearch").onclick=()=>{ $("#sheet").classList.add("open"); $("#q").focus(); };
$("#closeSheet").onclick=()=>$("#sheet").classList.remove("open");
let qT;
$("#q").oninput=e=>{
  clearTimeout(qT); const q=e.target.value.trim(); if(q.length<3){$("#results").innerHTML="";return;}
  qT=setTimeout(async()=>{
    try{
      const j=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=20&language=pt&countryCode=BR`);
      const r=(j.results||[]).filter(x=>(x.admin1||"").includes("Santa Catarina"));
      $("#results").innerHTML = r.length ? r.map((x,i)=>`<div class="res" data-i="${i}"><b>${esc(x.name)}</b> <span class="muted">${esc(x.admin2||"")}</span></div>`).join("") : `<p class="muted">Nada encontrado em SC.</p>`;
      $("#results").onclick=ev=>{
        const d=ev.target.closest(".res"); if(!d) return; const x=r[+d.dataset.i];
        // perto do litoral? (aprox.: longitude a leste de -49 ou litoral sul)
        const coast = x.longitude > -48.95 || (x.latitude < -28.3 && x.longitude > -49.8 && x.longitude > -49.0 - (-(x.latitude)-28.3)*0.6);
        const loc={g:"Meus locais", n:x.name, lat:+x.latitude.toFixed(4), lon:+x.longitude.toFixed(4), type: coast?"mar":"interior"};
        if(!custom.some(c=>c.lat===loc.lat&&c.lon===loc.lon)){ custom.unshift(loc); custom=custom.slice(0,8); store.set("custom",custom); }
        curLoc=loc; store.set("loc",curLoc); $("#sheet").classList.remove("open"); $("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$("#tabs").children].forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("main.tab").forEach(m=>m.hidden=m.id!==b.dataset.t);if(b.dataset.t==="app"&&data)renderDay();window.scrollTo(0,0);};
renderPerf(); renderTreinos(); renderSugestoes();
fillSelect(); load();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}); }
      };
    }catch(err){ $("#results").innerHTML=`<p class="err">Erro na busca.</p>`; }
  },350);
};
$("#btnGeo").onclick=()=>{
  if(!navigator.geolocation){ $("#upd").textContent="Localização indisponível neste navegador."; return; }
  $("#upd").textContent="Obtendo localização…";
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude, lon=p.coords.longitude;
    // escolhe o preset mais próximo para herdar o tipo (mar/lagoa/interior)
    let best=PRESETS[0], bd=1e9; PRESETS.forEach(x=>{const d=(x.lat-lat)**2+(x.lon-lon)**2; if(d<bd){bd=d;best=x;}});
    curLoc={g:"GPS", n:"Minha localização", lat:+lat.toFixed(4), lon:+lon.toFixed(4), type: bd<0.01?best.type:(best.type==="mar"&&bd<0.04?"mar":"interior")};
    store.set("loc",curLoc); $("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$("#tabs").children].forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("main.tab").forEach(m=>m.hidden=m.id!==b.dataset.t);if(b.dataset.t==="app"&&data)renderDay();window.scrollTo(0,0);};
renderPerf(); renderTreinos(); renderSugestoes();
fillSelect(); load();
  }, err=>{ $("#upd").textContent="Não foi possível obter a localização ("+err.message+")."; }, {timeout:10000});
};
window.addEventListener("resize",()=>{ if(data) renderDay(); });

$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$("#tabs").children].forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("main.tab").forEach(m=>m.hidden=m.id!==b.dataset.t);if(b.dataset.t==="app"&&data)renderDay();window.scrollTo(0,0);};
renderPerf(); renderTreinos(); renderSugestoes();
fillSelect(); load();
</script>
